name: CI

on:
  push:
    branches: [PYTHON_3.6]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-compatible-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r tool-triggers/requirements.txt
      - run: pytest --cov=app --cov-branch --cov-report=term-missing tests
      - run: bandit -r app -f json
      - run: radon cc app -s -a
