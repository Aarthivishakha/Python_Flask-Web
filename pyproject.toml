[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-web-api"
version = "1.0.0"
description = "Flask REST API starter for Python 3.8"
requires-python = ">=3.8,<3.9"
dependencies = [
  "Flask==3.0.3",
  "gunicorn==22.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
