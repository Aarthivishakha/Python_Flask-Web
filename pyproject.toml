[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-web-api"
version = "1.0.0"
description = "Experimental Flask REST API starter for Python 3.16 development"
requires-python = ">=3.16,<3.17"
dependencies = [
  "Flask>=3.1.3,<4.0.0",
  "gunicorn>=23.0.0,<24.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
# Ruff does not yet expose a py316 grammar target; use the newest supported one.
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
